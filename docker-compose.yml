services:
  avernus-map:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=your-super-secret-jwt-key
      - ADMIN_USERNAME=dm
      - ADMIN_PASSWORD=pwd
    volumes:
      - ./backend/data:/app/data
      # - ./player/data:/app/player/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/player"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s