name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - master

env:
  AZURE_CONTAINER_APP_NAME: avernus-campain-app
  AZURE_RESOURCE_GROUP: portfolio
  AZURE_LOCATION: australiaeast  # Change as needed
  AZURE_ENV_NAME: live
  DOCKER_IMAGE_NAME: romeshpanditha/avernusmap:latest
  CONTAINER_PORT: 3000

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_SECRET }}

      - name: Build and push image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE_NAME }} .
          docker push ${{ env.DOCKER_IMAGE_NAME }}

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp create \
            --name ${{ env.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --environment ${{ env.AZURE_ENV_NAME }} \
            --image ${{ env.DOCKER_IMAGE_NAME }} \
            --target-port ${{ env.CONTAINER_PORT }} \
            --ingress external \
            --registry-server docker.io \
          || \
          az containerapp update \
            --name ${{ env.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.DOCKER_IMAGE_NAME }} \
            --registry-server docker.io